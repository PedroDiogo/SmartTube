import org.gradle.api.artifacts.repositories.MavenArtifactRepository

def useCentralMirror = { repository ->
    if (repository instanceof MavenArtifactRepository && repository.url?.host == 'repo.maven.apache.org') {
        repository.url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
    }
}

allprojects {
    buildscript.repositories.all(useCentralMirror)
    repositories.all(useCentralMirror)
}
