name: Build SmartTube password test APK

on:
  push:
    branches: [codex/account-password-tv-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fd7f6654
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStbetaDebug
      - name: Verify package and signature
        run: |
          apk=(smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk)
          test "${#apk[@]}" -eq 1
          test "$(apkanalyzer manifest application-id "${apk[0]}")" = org.smarttube.beta.passwordtest
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify "${apk[0]}"
          cp "${apk[0]}" SmartTube-Password-Test.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SmartTube-Password-Test
          path: SmartTube-Password-Test.apk
          if-no-files-found: error
          retention-days: 7
