name: Build SmartTube password test APK

on:
  push:
    branches: [codex/account-password-tv-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --init-script .github/workflows/password-test-maven.init.gradle :smarttubetv:assembleStbetaDebug
      - name: Verify package and signature
        run: |
          apk=(smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk)
          test "${#apk[@]}" -eq 1
          test "$(apkanalyzer manifest application-id "${apk[0]}")" = org.smarttube.beta.passwordtest
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify "${apk[0]}"
          cp "${apk[0]}" SmartTube-Password-Test.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SmartTube-Password-Test
          path: SmartTube-Password-Test.apk
          if-no-files-found: error
          retention-days: 7
